<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Слушать в Hutred</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
.bgc{position:fixed;inset:-60px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.35;z-index:-1}
body{background:#000}
.track{display:flex;gap:28px;align-items:center;margin-top:12px}
@media (max-width:640px){.track{flex-direction:column;align-items:flex-start}}
.cover{width:240px;height:240px;border-radius:16px;background:#1a1a1a center/cover;flex-shrink:0;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@media (max-width:640px){.cover{width:100%;height:auto;aspect-ratio:1}}
.who{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.t{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.08}
.a{font-size:18px;color:#cfcfcf;margin:0 0 22px}
.hint{font-size:13px;color:var(--muted);margin-top:14px;min-height:18px}
</style>
</head>
<body>
<div class="bgc" id="bg"></div>
<div class="wrap">
  <header class="top">
    <img src="../logo.png" alt="">
    <b>Hutred</b>
    <span class="sp"></span>
    <a class="link" href="../#download">Скачать</a>
  </header>

  <div class="track">
    <div class="cover" id="cover" role="img" aria-label="Обложка"></div>
    <div>
      <div class="who">Сейчас играет в Hutred</div>
      <h1 class="t" id="title">Трек</h1>
      <p class="a" id="artist"></p>
      <div class="row">
        <a class="btn" id="open" href="#">Открыть в Hutred</a>
        <a class="btn ghost" id="orig" href="#" target="_blank" rel="noopener" hidden>Слушать на YouTube</a>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <div class="cap">Нет Hutred?</div>
  <div class="grid" style="margin-top:0">
    <div class="card"><h3>Windows</h3><p>Установщик, дальше обновляется сам.</p><a class="btn" id="dl-win" href="#">Скачать</a></div>
    <div class="card"><h3>Android</h3><p>Файл .apk.</p><a class="btn" id="dl-android" href="#">Скачать</a></div>
    <div class="card"><h3>iPhone</h3><p>Через SideStore.</p><a class="btn ghost" href="../phone.html#iphone">Как установить</a></div>
  </div>
</div>
<script>
const PUB = 'https://izkllkqilyspwxthssdc.supabase.co/storage/v1/object/public/releases';
const q = new URLSearchParams(location.search);
const s = q.get('s'), u = q.get('u') || '', t = q.get('t') || 'Трек', a = q.get('a') || '', c = q.get('c');
document.getElementById('title').textContent = t;
document.getElementById('artist').textContent = a;
document.title = t + (a ? ' — ' + a : '') + ' · Hutred';
if (c && c.startsWith('https://')) {
  document.getElementById('cover').style.backgroundImage = 'url("' + c.replace(/"/g, '') + '")';
  document.getElementById('bg').style.backgroundImage = 'url("' + c.replace(/"/g, '') + '")';
}
const app = 'hutred://play?' + q.toString();
const open = document.getElementById('open');
open.href = app;

// Ссылка на оригинал — если Hutred не стоит.
let orig = null, label = '';
if (s === 'youtube' && u) { orig = 'https://youtu.be/' + encodeURIComponent(u); label = 'Слушать на YouTube'; }
else if (s === 'soundcloud' && u.startsWith('https://')) { orig = u; label = 'Слушать на SoundCloud'; }
else if (s === 'spotify' && u.startsWith('deezer:')) { orig = 'https://www.deezer.com/track/' + u.slice(7); label = 'Слушать на Deezer'; }
else if (s === 'spotify' && u) { orig = 'https://open.spotify.com/track/' + encodeURIComponent(u); label = 'Слушать на Spotify'; }
if (orig) { const o = document.getElementById('orig'); o.href = orig; o.textContent = label; o.hidden = false; }

// Сразу пробуем открыть приложение; если страница осталась на месте — подсказка.
const hint = document.getElementById('hint');
if (s && u) {
  hint.textContent = 'Открываю Hutred…';
  setTimeout(() => { location.href = app; }, 300);
  setTimeout(() => { if (!document.hidden) hint.textContent = 'Не открылось? Скачай Hutred ниже — это бесплатно.'; }, 2200);
}
fetch(PUB + '/latest.json?t=' + Date.now()).then(r => r.json()).then(j => {
  if (j.windows) document.getElementById('dl-win').href = j.windows;
  if (j.android) document.getElementById('dl-android').href = j.android;
}).catch(() => {});
</script>
</body>
</html>
