name: Server

# Выкладка функций Supabase и проверка защиты.
# Нужны секреты: SUPABASE_URL, SUPABASE_KEY (publishable/anon),
# SUPABASE_ACCESS_TOKEN (Supabase → аватар → Account → Access Tokens).
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Выложить функции'
        type: boolean
        default: true
      check:
        description: 'Проверить защиту'
        type: boolean
        default: true
      deps:
        description: 'Обновить зависимости (pubspec.lock) в ветке'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['supabase/functions/**']

jobs:
  deps:
    if: github.event_name == 'workflow_dispatch' && inputs.deps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Обновить зависимости
        run: |
          flutter pub upgrade
          flutter pub outdated || true
          flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Сохранить
        run: |
          git config user.name Hutred
          git config user.email noreply@hutred.local
          git add pubspec.lock
          git diff --cached --quiet && { echo "Всё уже свежее"; exit 0; }
          git commit -m "Обновлены зависимости"
          git push

  deploy:
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Выложить функции
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN"; exit 1; fi
          REF=$(echo "$SB_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase functions deploy hutred --no-verify-jwt --project-ref "$REF" --yes
          supabase functions deploy spotify --no-verify-jwt --project-ref "$REF" --yes

  check:
    needs: deploy
    if: always() && (github.event_name == 'push' || inputs.check)
    runs-on: ubuntu-latest
    steps:
      - name: Проверка защиты
        env:
          U: ${{ secrets.SUPABASE_URL }}
          K: ${{ secrets.SUPABASE_KEY }}
        run: |
          fails=0
          ok()  { echo "✅ $1"; }
          bad() { echo "❌ $1"; fails=$((fails+1)); }
          H=(-H "apikey: $K" -H "Authorization: Bearer $K")

          # 1. Без входа общие настройки и секреты не читаются.
          r=$(curl -s "${H[@]}" "$U/rest/v1/app_config?select=key,value")
          [ "$r" = "[]" ] && ok "app_config без входа пуст" || bad "app_config без входа: $r"
          r=$(curl -s "${H[@]}" "$U/rest/v1/app_secrets?select=key")
          [ "$r" = "[]" ] || echo "$r" | grep -q '"code"' && ok "app_secrets закрыт" || bad "app_secrets: $r"

          # 2. Чужие медиатеки и профили без входа не видны.
          for t in library_items profiles friendships shared_playlists track_fixes rate_hits; do
            r=$(curl -s "${H[@]}" "$U/rest/v1/$t?select=*&limit=1")
            [ "$r" = "[]" ] || echo "$r" | grep -q '"code"' && ok "$t закрыта" || bad "$t видна без входа: ${r:0:120}"
          done

          # 3. Служебные функции базы нельзя вызвать из приложения.
          for f in email_for_username rate_hit; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H 'content-type: application/json' \
              -d '{"p_username":"test","p_bucket":"x","p_max":1,"p_seconds":1}' "$U/rest/v1/rpc/$f")
            [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "404" ] && ok "rpc $f закрыта ($code)" || bad "rpc $f ответила $code"
          done

          # 4. Запись без входа запрещена.
          code=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H 'content-type: application/json' \
            -d '{"key":"x","value":{}}' "$U/rest/v1/app_config")
          [ "$code" != "201" ] && ok "запись в app_config без входа запрещена ($code)" || bad "app_config записался без входа"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H 'content-type: image/png' \
            --data-binary 'x' "$U/storage/v1/object/avatars/anon/test.png")
          [ "$code" != "200" ] && ok "загрузка в avatars без входа запрещена ($code)" || bad "avatars принял файл без входа"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H 'content-type: audio/mpeg' \
            --data-binary 'x' "$U/storage/v1/object/tracks/anon/test.mp3")
          [ "$code" != "200" ] && ok "загрузка в tracks без входа запрещена ($code)" || bad "tracks принял файл без входа"

          # 5. Функции сервера без входа не отдают ключи.
          for p in spotify-token ai; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "apikey: $K" "$U/functions/v1/hutred/$p")
            [ "$code" = "401" ] && ok "hutred/$p без входа → 401" || bad "hutred/$p без входа ответила $code"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X GET "$U/functions/v1/hutred/login")
          [ "$code" = "405" ] && ok "hutred принимает только POST" || bad "hutred GET → $code"

          # 6. Перебор паролей упирается в лимит.
          last=""
          for i in $(seq 1 12); do
            last=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
              -d '{"login":"nobody_test_ratelimit","password":"wrong"}' "$U/functions/v1/hutred/login")
          done
          [ "$last" = "429" ] && ok "перебор паролей → 429" || bad "после 12 попыток входа ответ $last (ждали 429)"

          # 7. Ретранслятор Spotify не ходит на чужие сайты.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $K" "$U/functions/v1/spotify?u=https://example.com/")
          [ "$code" = "403" ] && ok "ретранслятор не пускает на чужие сайты" || bad "ретранслятор на example.com → $code"

          # 8. Только HTTPS.
          code=$(curl -s -o /dev/null -w '%{http_code}' "${U/https:/http:}/rest/v1/")
          [ "$code" = "301" ] || [ "$code" = "308" ] || [ "$code" = "000" ] || [ "$code" = "400" ] && ok "http не принимается ($code)" || bad "http → $code"

          echo
          [ $fails -eq 0 ] && echo "Всё закрыто" || { echo "Проблем: $fails"; exit 1; }
