name: VPN test
on:
  push:
    branches: [vpntest]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Xray
        run: |
          curl -fsSL -o x.zip https://github.com/XTLS/Xray-core/releases/download/v26.9.30/Xray-linux-64.zip
          mkdir xr && unzip -q x.zip -d xr
          ./xr/xray version | head -1
          ./xr/xray x25519 | tee keys.txt
      - name: Config from key (same structure, made-up credentials)
        run: |
          PBK=$(grep -iE "public|password" keys.txt | head -1 | awk -F': ' '{print $2}' | tr -d ' ')
          echo "pbk=$PBK"
          export VPN_KEY="vless://11111111-2222-4333-8444-555555555555@example.com:443?type=grpc&security=reality&encryption=none&sni=www.microsoft.com&fp=firefox&pbk=$PBK&sid=2a29b8ec4300b189&alpn=h2&serviceName=livestreamcontent"
          flutter test test/vpn_config_test.dart
          cat xray-test.json; echo
          ./xr/xray run -test -c xray-test.json
      - name: Core download URL
        run: curl -sS -o /dev/null -w "%{http_code} %{size_download}\n" "${{ secrets.SUPABASE_URL }}/storage/v1/object/public/releases/tools/hutred-xray-v26.9.30.exe"
