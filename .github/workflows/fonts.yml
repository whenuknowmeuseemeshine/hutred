name: Fetch fonts
on:
  push:
    branches: [dev]
    paths: [".github/workflows/fonts.yml"]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install fonttools
          mkdir -p tmpf assets/fonts
          curl -fsSL -o tmpf/JBM.ttf "https://github.com/google/fonts/raw/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          fonttools varLib.instancer tmpf/JBM.ttf wght=500 -o assets/fonts/JetBrainsMono-Medium.ttf
          git rm -q .github/workflows/fonts.yml
          git config user.name Hutred; git config user.email noreply@hutred.local
          git add assets/fonts && git commit -m "Fonts: JetBrains Mono" && git push
