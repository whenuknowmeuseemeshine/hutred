name: Fetch fonts
on:
  push:
    branches: [dev]
    paths: [".github/workflows/fonts.yml"]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install fonttools
          mkdir -p tmpf assets/fonts
          curl -fsSL -o tmpf/Unbounded.ttf "https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          for w in 500:Medium 600:SemiBold 700:Bold; do
            fonttools varLib.instancer tmpf/Unbounded.ttf wght=${w%%:*} -o assets/fonts/Unbounded-${w##*:}.ttf
          done
          git rm -q .github/workflows/fonts.yml
          git config user.name Hutred; git config user.email noreply@hutred.local
          git add assets/fonts && git commit -m "Fonts: Unbounded" && git push
