# Облачная сборка Hutred: Android (APK), iPhone (IPA без подписи) и Windows (zip).
# Запускается при каждом push в main и вручную (Actions → Build → Run workflow).
# Готовые файлы — Actions → нужный запуск → Artifacts,
# а при теге вида v1.5.0 — ещё и в Releases.
#
# Чтобы APK всегда подписывался одним ключом (иначе новая версия не встанет
# поверх старой), добавь в Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64 — содержимое файла hutred-release.jks.b64
#   ANDROID_KEY_PASSWORD    — пароль из key.properties
# И для входа в аккаунт (облако Supabase):
#   SUPABASE_URL — адрес проекта Supabase
#   SUPABASE_KEY — publishable-ключ Supabase
# Для автообновления (файлы новых версий кладутся в Supabase Storage):
#   SUPABASE_SERVICE_KEY — service_role ключ Supabase (Project Settings → API Keys)
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ios:
        description: Собрать iPhone (macOS-минуты дорогие, ×10)
        type: boolean
        default: false
      windows:
        description: Собрать Windows (минуты ×2)
        type: boolean
        default: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ключ подписи из секретов
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/hutred-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=hutred\nstoreFile=hutred-release.jks\n' \
              "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
          else
            echo "Секретов нет — APK будет подписан временным ключом"
          fi
      - name: Ядро VPN (Xray) для Android
        run: |
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.9.30/Xray-android-arm64-v8a.zip
          mkdir -p android/app/src/main/jniLibs/arm64-v8a xray-tmp
          unzip -o xray.zip -d xray-tmp
          cp xray-tmp/xray android/app/src/main/jniLibs/arm64-v8a/libxray.so
          rm -rf xray.zip xray-tmp
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }} --dart-define=HUTRED_BUILD=${{ github.run_number }} --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Hutred.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hutred-android
          path: Hutred.apk

  # Репозиторий открытый — сборки бесплатные, iPhone собираем при каждой
  # выкладке. Вручную (проверка) — только с галочкой.
  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    # arm64-машины Mac у GitHub часто заняты — берём Intel.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Без подписи: подписывает SideStore/Sideloadly твоим Apple ID при установке.
      - run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }} --dart-define=HUTRED_BUILD=${{ github.run_number }} --build-number=${{ github.run_number }} --build-name=1.4.${{ github.run_number }}
      - name: Собрать .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Hutred.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Hutred-ios
          path: Hutred.ipa

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }} --dart-define=HUTRED_BUILD=${{ github.run_number }} --build-number=${{ github.run_number }}
      # yt-dlp рядом с hutred.exe: через него играет YouTube, когда YouTube
      # ломает библиотеку. Дальше Hutred сам обновляет его раз в день.
      - name: Добавить yt-dlp
        shell: pwsh
        run: Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile build/windows/x64/runner/Release/yt-dlp.exe
      - name: Упаковать в zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Hutred-windows.zip
      # Установщик: один Hutred-Setup.exe с ярлыком на рабочем столе.
      - name: Собрать установщик
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:HUTRED_VERSION = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\hutred.iss
          Move-Item build\installer\Hutred-Setup.exe Hutred-Setup.exe
      # Ядро Xray для своего VPN-ключа. В установщик не кладём (Supabase
      # принимает файлы до 50 МБ) — Hutred скачает его сам при включении VPN.
      - name: Ядро VPN (Xray)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/download/v26.9.30/Xray-windows-64.zip -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray-tmp -Force
          Copy-Item xray-tmp/xray.exe hutred-xray.exe
          Remove-Item xray.zip, xray-tmp -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Hutred-windows
          path: |
            Hutred-Setup.exe
            Hutred-windows.zip
            hutred-xray.exe

  # Готовые файлы выкладываются на страницу Releases → «Hutred — последняя сборка»:
  # оттуда их удобно скачивать (и оттуда же потом будет брать обновления приложение).
  release:
    # Выкладываем, даже если iPhone в этот раз не собирали.
    if: >-
      always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && needs.android.result == 'success' && needs.windows.result == 'success'
      && (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: assets
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Автообновление: кладём установщик, APK и latest.json в Supabase Storage.
      - name: Выложить обновление в Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUILD: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SB_KEY" ] || [ -z "$SB_URL" ]; then
            echo "Нет SUPABASE_SERVICE_KEY — автообновление пропущено"; exit 0
          fi
          up() {
            curl -sSf -X POST "$SB_URL/storage/v1/object/releases/$2" \
              -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" \
              -H "x-upsert: true" -H "cache-control: max-age=60" \
              -H "Content-Type: $3" --data-binary @"$1" > /dev/null
          }
          up Hutred-Setup.exe "windows/Hutred-Setup-$BUILD.exe" application/octet-stream
          up Hutred.apk "android/Hutred-$BUILD.apk" application/vnd.android.package-archive
          up src/assets/logo.png discord/logo.png image/png
          up hutred-xray.exe "tools/hutred-xray-v26.9.30.exe" application/octet-stream || echo "ядро VPN не выложено"
          PUB="$SB_URL/storage/v1/object/public/releases"
          python3 - <<PY
          import json, os
          json.dump({
            "build": int(os.environ["BUILD"]),
            "version": "1.4.$BUILD",
            "notes": (os.environ.get("MSG") or "").split("\n")[0],
            "windows": "$PUB/windows/Hutred-Setup-$BUILD.exe",
            "android": "$PUB/android/Hutred-$BUILD.apk",
          }, open("latest.json", "w"), ensure_ascii=False)
          PY
          up latest.json latest.json application/json
          echo "Обновление $BUILD выложено"

          # iPhone: .ipa и «источник» для SideStore — новые версии Hutred
          # появляются в SideStore как обновления.
          if up Hutred.ipa "ios/Hutred-$BUILD.ipa" application/octet-stream; then
            IPA_SIZE=$(stat -c%s Hutred.ipa)
            python3 - <<PY
          import json, os, datetime
          url = "$PUB/ios/Hutred-$BUILD.ipa"
          ver = "1.4.$BUILD"
          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          notes = (os.environ.get("MSG") or "").split("\n")[0]
          app = {
            "name": "Hutred",
            "bundleIdentifier": "ru.hutred.hutred",
            "developerName": "Hutred",
            "subtitle": "Музыка из любых источников",
            "localizedDescription": "Медиатека, SoundCloud, YouTube, Spotify, караоке-тексты.",
            "iconURL": "$PUB/discord/logo.png",
            "tintColor": "#8E5CF5",
            "versions": [{
              "version": ver, "buildVersion": "$BUILD", "date": now,
              "localizedDescription": notes, "downloadURL": url,
              "size": $IPA_SIZE, "minOSVersion": "13.0",
            }],
            # Старые поля — для старых версий SideStore.
            "version": ver, "versionDate": now, "versionDescription": notes,
            "downloadURL": url, "size": $IPA_SIZE,
          }
          json.dump({"name": "Hutred", "identifier": "ru.hutred.source",
                     "iconURL": "$PUB/discord/logo.png",
                     "apps": [app], "news": []},
                    open("sidestore.json", "w"), ensure_ascii=False)
          PY
            up sidestore.json sidestore.json application/json
            echo "SideStore: версия 1.4.$BUILD"
          else
            echo "Не удалось выложить .ipa (может, слишком большой для хранилища)"
          fi

          # Старые сборки удаляем, оставляем две последние: место в облаке не бесконечное.
          # Старые .ipa трогаем, только если в этот раз собран новый
          # (иначе источник SideStore указывает на прошлую сборку).
          for dir in windows android $([ -f Hutred.ipa ] && echo ios); do
            curl -sS -X POST "$SB_URL/storage/v1/object/list/releases" \
              -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prefix\":\"$dir/\",\"limit\":1000}" > list.json || continue
            python3 - "$dir" "$BUILD" > old.json <<'PY'
          import json, re, sys
          d, build = sys.argv[1], int(sys.argv[2])
          try:
              items = json.load(open("list.json"))
          except Exception:
              items = []
          old = []
          for it in items if isinstance(items, list) else []:
              m = re.search(r"-(\d+)\.", it.get("name", ""))
              if m and int(m.group(1)) < build - 1:
                  old.append(f"{d}/{it['name']}")
          print(json.dumps({"prefixes": old}))
          PY
            if [ "$(cat old.json)" != '{"prefixes": []}' ]; then
              curl -sS -X DELETE "$SB_URL/storage/v1/object/releases" \
                -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" \
                -H "Content-Type: application/json" -d @old.json > /dev/null || true
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Hutred — последняя сборка' }}
          body: |
            Собрано из коммита ${{ github.sha }}.
            Windows — Hutred-Setup.exe, Android — Hutred.apk, iPhone — Hutred.ipa (ставится через SideStore/Sideloadly).
          make_latest: true
          files: |
            Hutred.apk
            Hutred.ipa
            Hutred-Setup.exe
            Hutred-windows.zip
            hutred-xray.exe
