name: hutred
description: "Hutred — музыкальный плеер: треки из любых источников, поиск и караоке-текст."
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Воспроизведение (Android, iOS, macOS нативно; Windows/Linux через media_kit)
  just_audio: ^0.9.42
  just_audio_media_kit: ^2.0.6
  # Управление музыкой из шторки Android и «Исполняется» на iPhone.
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  # Связь с Discord на Windows (именованный канал через WinAPI).
  win32: ^5.15.0
  ffi: ^2.1.0
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_windows_audio: ^1.0.9
  # Источники
  youtube_explode_dart: ^3.1.0
  file_picker: ^10.3.3
  # Открыть ссылку на новый APK (обновление на Android).
  url_launcher: ^6.3.1
  # Окно и значок в трее на компьютере (крестик прячет в трей).
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  # Сеть, хранение, состояние
  http: ^1.2.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  # Аккаунты и синхронизация медиатеки между устройствами
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/app_icon.ico

# Иконка приложения из логотипа: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
